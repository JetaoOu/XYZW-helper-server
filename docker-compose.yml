services:
  app:
    build:
      context: .
      args:
        # 国内网络可覆盖为镜像站地址，例如：
        # NODE_IMAGE=docker.m.daocloud.io/library/node:22-bookworm-slim
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    container_name: xyzw-helper-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/xyzw.db
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
